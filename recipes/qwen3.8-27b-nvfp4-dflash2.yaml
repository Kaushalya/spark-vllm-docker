# Recipe: Qwen3.8-27B-NVFP4 with DFlash2
# Keeps Unsloth's compressed-tensors FP8 lm_head quantized while DFlash2 uses
# that head for candidate TopK. DFlash2 is currently provided by vLLM PR #52816.

recipe_version: "1"
name: Qwen3.8-27B-NVFP4-DFlash2
description: DFlash2 serving with an NVFP4 target and FP8 lm_head on one DGX Spark

model: unsloth/Qwen3.8-27B-NVFP4

# Keep this experimental PR build separate from the normal vllm-node image.
container: vllm-node-dflash2
build_args:
  - --apply-vllm-pr
  - "52816"

# PR #52816 initially accepts only unquantized target heads. This mod also
# permits compressed-tensors heads and continues through their quantized apply().
mods:
  - mods/dflash2-compressed-lm-head

cluster_only: false
solo_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  num_speculative_tokens: 7

env: {}

command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --load-format fastsafetensors \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --speculative-config '{{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":{num_speculative_tokens}}}' \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3
